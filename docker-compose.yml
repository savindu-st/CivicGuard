version: '3.8'

services:
  # -------------------------------------------------------------
  # Kong API Gateway (Single External Entry Point)
  # -------------------------------------------------------------
  kong:
    image: kong:3.4-alpine
    container_name: civicguard-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000" # Proxy API
      - "8001:8001" # Admin GUI / Loopback
    networks:
      - civicguard-net
    depends_on:
      - incident-service
      - ticket-service
      - notification-service
      - relief-service

  # -------------------------------------------------------------
  # AI Service (FastAPI + YOLO)
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./backend/services/ai-service
      dockerfile: Dockerfile
    container_name: civicguard-ai-service
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - civicguard-net

  # -------------------------------------------------------------
  # Incident Service (Case Builder + Verification + Aggregator)
  # -------------------------------------------------------------
  incident-service:
    build:
      context: ./backend/services/incident-service
      dockerfile: Dockerfile
    container_name: civicguard-incident-service
    environment:
      - PORT=4001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AI_SERVICE_URL=http://ai-service:5000
      - NOTIFICATION_SERVICE_URL=http://notification-service:4003
    ports:
      - "4001:4001"
    networks:
      - civicguard-net
    depends_on:
      - ai-service

  # -------------------------------------------------------------
  # Ticket Service (Council Tickets + Crew Dispatch)
  # -------------------------------------------------------------
  ticket-service:
    build:
      context: ./backend/services/ticket-service
      dockerfile: Dockerfile
    container_name: civicguard-ticket-service
    environment:
      - PORT=4002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:4003
      - INCIDENT_SERVICE_URL=http://incident-service:4001
    ports:
      - "4002:4002"
    networks:
      - civicguard-net

  # -------------------------------------------------------------
  # Notification Service (Socket.IO Real-Time Dispatch)
  # -------------------------------------------------------------
  notification-service:
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    container_name: civicguard-notification-service
    environment:
      - PORT=4003
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "4003:4003"
    networks:
      - civicguard-net

  # -------------------------------------------------------------
  # Relief Service (SOS Requests, Shelters & Supplies)
  # -------------------------------------------------------------
  relief-service:
    build:
      context: ./backend/services/relief-service
      dockerfile: Dockerfile
    container_name: civicguard-relief-service
    environment:
      - PORT=4004
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:4003
    ports:
      - "4004:4004"
    networks:
      - civicguard-net

  # -------------------------------------------------------------
  # Operations Web Application (React + Vite)
  # -------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: civicguard-web
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8000
      - VITE_SOCKET_URL=http://localhost:4003
    ports:
      - "3000:3000"
    networks:
      - civicguard-net
    depends_on:
      - kong

networks:
  civicguard-net:
    driver: bridge
